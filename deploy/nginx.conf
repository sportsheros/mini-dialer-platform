# /etc/nginx/sites-available/mini-dialer  (symlink into sites-enabled, then `nginx -t && systemctl reload nginx`)
# TLS: run `certbot --nginx -d dialer.example.com` after this works over HTTP.

upstream dialer_api {
    # PM2 cluster mode shares one port across API instances.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name dialer.example.com;

    # Built dashboard (npm run web:build → web/dist)
    root /srv/mini-dialer/web/dist;
    index index.html;

    client_max_body_size 2m;   # 5,000-lead uploads are ~300 KB

    location /api/ {
        proxy_pass http://dialer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The app trusts exactly one proxy hop (app.set('trust proxy', 1)) for per-IP rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://dialer_api;
        access_log off;
    }

    # Socket.IO: websocket upgrade
    location /socket.io/ {
        proxy_pass http://dialer_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback (hash routing, but keep it robust)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
